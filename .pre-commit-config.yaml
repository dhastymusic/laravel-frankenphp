repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: php-lint
        name: PHP Lint
        entry: docker-compose exec -T app php -l
        language: system
        files: \.php$

      - id: phpunit
        name: PHPUnit
        entry: docker-compose exec -T app vendor/bin/phpunit
        language: system
        pass_filenames: false
